<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ARVO R4.2 · Responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#181c18;color:#ecefe4;font:14px/1.5 system-ui,sans-serif}header{padding:12px 20px;display:flex;gap:22px;align-items:center;position:sticky;top:0;background:#242923;z-index:3;border-bottom:1px solid #465044}h1{font-size:15px;margin:0}select,button,a{font:inherit;color:inherit;background:#354131;border:1px solid #63705a;padding:6px 10px;text-decoration:none}label{display:flex;gap:8px;align-items:center}.status{margin-left:auto;font:12px monospace}main{padding:25px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.frame-box{position:relative;flex-shrink:0}iframe{border:0;display:block;background:#f4f1eb;transform-origin:top left;box-shadow:0 15px 80px #0007}.notes{max-width:800px;margin:0 auto;padding:10px 20px 30px;color:#b7c3ae}output{font:12px/1.7 monospace;white-space:pre-wrap;display:block}a:hover,button:hover{background:#495640}</style></head><body><header><h1>ARVO R4.2 · 화면 검수</h1><label>화면 폭 <select id="width" aria-label="화면 폭"><option value="1440">1440px</option><option value="1366">1366px</option><option value="768">768px</option><option value="390">390px</option><option value="320">320px</option></select></label><label>장면 <select id="scene" aria-label="장면"><option value="top">첫 화면</option><option value="welcome">브랜드</option><option value="rooms">객실 선택</option><option value="moments">머무는 장면</option><option value="gallery">갤러리</option><option value="arrival">도착 안내</option><option value="booking">예약</option></select></label><label>높이 <select id="height" aria-label="화면 높이"><option value="auto">자동</option><option value="440">440px</option><option value="844">844px</option><option value="900">900px</option></select></label><button id="inspect">화면 점검</button><a href="index.html">실제 페이지</a><span class="status" id="status"></span></header><main><div class="frame-box" id="frame-box"><iframe id="preview-frame" title="아르보호텔 반응형 홈페이지 미리보기" src="index.html"></iframe></div></main><div class="notes"><output id="report">화면을 불러오는 중입니다.</output></div><script>
const params=new URLSearchParams(location.search);const width=document.getElementById('width');const scene=document.getElementById('scene');const frame=document.getElementById('preview-frame');let currentWidth=Number(params.get('width'))||1440;if(![1440,1366,768,390,320].includes(currentWidth))currentWidth=1440;width.value=String(currentWidth);
function resize(){const w=Number(width.value);const requestedHeight=document.getElementById('height').value;const h=requestedHeight==='auto'?(w<=600?844:900):Number(requestedHeight);const scale=Math.min(1,(window.innerWidth-60)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';const box=document.getElementById('frame-box');box.style.width=w*scale+'px';box.style.height=h*scale+'px';document.getElementById('status').textContent=w+' × '+h+' CSS px';setTimeout(inspect,350)}
function inspect(){try{const d=frame.contentDocument;const w=frame.contentWindow;const visible=Array.from(d.querySelectorAll('body *')).filter(e=>{const r=e.getBoundingClientRect();const s=w.getComputedStyle(e);return r.width&&r.height&&s.display!=='none'&&s.visibility!=='hidden'&&!e.closest('dialog:not([open]),[inert],.gallery-track')});const overflow=visible.filter(e=>{const r=e.getBoundingClientRect();return r.left < -1 || r.right > d.documentElement.clientWidth+1}).filter(e=>!e.closest('.hero-media,.welcome-line,.booking-word,.hero-side,.moment-word')).map(e=>({tag:e.tagName,id:e.id,cls:e.className}));const report={viewport:w.innerWidth,layoutWidth:d.documentElement.clientWidth,documentWidth:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,brokenImages:Array.from(d.images).filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')),openDialogs:Array.from(d.querySelectorAll('dialog[open]')).map(e=>e.id),selectedRoom:d.querySelector('#room-korean')?.textContent,possibleOverflow:overflow.slice(0,12)};document.getElementById('report').textContent=JSON.stringify(report,null,2)}catch(e){document.getElementById('report').textContent=e.message}}
width.addEventListener('change',resize);document.getElementById('height').addEventListener('change',resize);scene.addEventListener('change',()=>{const el=frame.contentDocument.getElementById(scene.value);el?.scrollIntoView({behavior:'instant',block:'start'});setTimeout(inspect,250)});document.getElementById('inspect').addEventListener('click',inspect);frame.addEventListener('load',()=>{resize();const requested=params.get('scene');if(requested&&frame.contentDocument.getElementById(requested)){scene.value=requested;frame.contentDocument.getElementById(requested).scrollIntoView({behavior:'instant',block:'start'})}setTimeout(inspect,800)});window.addEventListener('resize',resize);resize();
</script></body></html>
